[project]
name = "2026-06-dip"
version = "0.1.0"
description = "DIP"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.135.1",
    "openai>=2.30.0",
    "pydantic>=2.12.5",
    "sqlalchemy>=2.0.48",
    "aiosqlite>=0.20.0",
    "ruff>=0.15.8",
    "mypy>=1.19.1",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
files = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
